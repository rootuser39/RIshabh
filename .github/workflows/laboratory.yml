name: Verify and publish laboratory

on:
  push:
    branches: [main]
    paths: ['content/**', 'interface/**', 'scripts/**', 'assets/**', 'tests/**', 'docs/**', 'README.md', 'index.html', '.github/workflows/laboratory.yml']
  pull_request:
    paths: ['content/**', 'interface/**', 'scripts/**', 'assets/**', 'tests/**', 'docs/**', 'README.md', 'index.html', '.github/workflows/laboratory.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laboratory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild artwork and verify content
        run: |
          python scripts/build_observatory.py
          python scripts/build_lab.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check interface/lab.js
          node --check interface/motion.js
          git diff --exit-code -- assets README.md index.html content/derived.json
      - name: Package the static laboratory
        run: python scripts/build_lab.py --package _site
      - name: Check existing Pages enablement
        id: pages-state
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPO_NAME'],
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=20) as response:
              enabled = json.load(response).get('has_pages', False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          print('Pages already enabled:', enabled)
          PY
      - name: Upload the static Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.pages_enabled == 'true' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the laboratory
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

