<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
<title id="title">Execution leaves a trace</title><desc id="desc">A decorative moving signal trace, not live telemetry.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#211831"/><stop offset="1" stop-color="#090810"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#494252"/><stop offset=".32" stop-color="#dad3e2"/><stop offset=".5" stop-color="#f5f1ff"/><stop offset=".72" stop-color="#776b81"/><stop offset="1" stop-color="#2b2432"/></linearGradient>
 <linearGradient id="trail"><stop stop-color="#bdacff" stop-opacity="0"/><stop offset="1" stop-color="#bdacff"/></linearGradient>
 <radialGradient id="void"><stop offset=".7" stop-color="#030207"/><stop offset="1" stop-color="#100b19"/></radialGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 H 0 V 48" fill="none" stroke="#c6b8d9" stroke-opacity=".05" stroke-width="1"/></pattern>
</defs>
<style>
 .turn { animation: turn 140s linear infinite; }
 .counter { animation: turn 210s linear infinite reverse; }
 .slow { animation: turn 280s linear infinite; }
 .signal { animation: flow 28s linear infinite; }
 .breathe { animation: breathe 20s ease-in-out infinite; }
 .blink { animation: breathe 22s ease-in-out infinite; }
 @keyframes turn { to { transform: rotate(360deg); } }
 @keyframes flow { to { stroke-dashoffset: -400; } }
 @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.95; } }
 @media (prefers-reduced-motion: reduce) { .turn,.counter,.slow,.signal,.breathe,.blink { animation:none !important; } }

 .wing-open { animation:rare-wing-open 18s steps(1,end) infinite; }
 .wing-mid { animation:rare-wing-mid 18s steps(1,end) infinite; }
 .wing-low { animation:rare-wing-low 18s steps(1,end) infinite; }
 @keyframes rare-wing-open { 0%,86%,100% { opacity:1; } 87% { opacity:0; } 98% { opacity:1; } }
 @keyframes rare-wing-mid { 0%,100% { opacity:0; } 87% { opacity:1; } 90% { opacity:0; } 95% { opacity:1; } 98% { opacity:0; } }
 @keyframes rare-wing-low { 0%,100% { opacity:0; } 90% { opacity:1; } 95% { opacity:0; } }
 @media (prefers-reduced-motion:reduce) { .wing-open,.wing-mid,.wing-low { animation:none !important; } }
</style>
<rect width="100%" height="100%" rx="18" fill="#090810"/>
<text x="28" y="35" fill="#a09aaf" font-family="'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" letter-spacing="2">EXECUTION LEAVES A TRACE.</text><path d="M 28 68 H 134 L 163 45 L 190 91 L 225 32 L 258 68 H 378 L 405 48 L 439 85 L 466 56 L 485 68 H 690 L 718 45 L 748 89 L 780 35 L 817 68 H 1172" stroke="#625472" fill="none" stroke-width="1.2"/><path d="M 28 68 H 134 L 163 45 L 190 91 L 225 32 L 258 68 H 378 L 405 48 L 439 85 L 466 56 L 485 68 H 690 L 718 45 L 748 89 L 780 35 L 817 68 H 1172" stroke="#bdacff" fill="none" stroke-width="2" stroke-dasharray="50 350" class="signal"/>
<rect x=".5" y=".5" width="1199" height="111" rx="18" fill="none" stroke="#30283f"/>
</svg>
