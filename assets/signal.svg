<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
<title id="title">Execution leaves a trace</title><desc id="desc">A decorative moving signal trace, not live telemetry.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#1b211d"/><stop offset="1" stop-color="#080a0c"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454b48"/><stop offset=".32" stop-color="#d5dbd3"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".72" stop-color="#6c776c"/><stop offset="1" stop-color="#242c26"/></linearGradient>
 <linearGradient id="trail"><stop stop-color="#ceff79" stop-opacity="0"/><stop offset="1" stop-color="#ceff79"/></linearGradient>
 <radialGradient id="void"><stop offset=".7" stop-color="#030404"/><stop offset="1" stop-color="#0a0e0b"/></radialGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 H 0 V 48" fill="none" stroke="#b9c7bd" stroke-opacity=".05" stroke-width="1"/></pattern>
</defs>
<style>
 .turn { animation: turn 42s linear infinite; }
 .counter { animation: turn 64s linear infinite reverse; }
 .slow { animation: turn 90s linear infinite; }
 .signal { animation: flow 10s linear infinite; }
 .breathe { animation: breathe 6s ease-in-out infinite; }
 .blink { animation: breathe 4s ease-in-out infinite; }
 @keyframes turn { to { transform: rotate(360deg); } }
 @keyframes flow { to { stroke-dashoffset: -400; } }
 @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.95; } }
 @media (prefers-reduced-motion: reduce) { .turn,.counter,.slow,.signal,.breathe,.blink { animation:none !important; } }
</style>
<rect width="100%" height="100%" rx="18" fill="#080a0c"/>
<text x="28" y="35" fill="#929995" font-family="'DejaVu Sans Mono',monospace" font-size="12" font-weight="400" letter-spacing="2">EXECUTION LEAVES A TRACE.</text><path d="M 28 68 H 134 L 163 45 L 190 91 L 225 32 L 258 68 H 378 L 405 48 L 439 85 L 466 56 L 485 68 H 690 L 718 45 L 748 89 L 780 35 L 817 68 H 1172" stroke="#495d40" fill="none" stroke-width="1.2"/><path d="M 28 68 H 134 L 163 45 L 190 91 L 225 32 L 258 68 H 378 L 405 48 L 439 85 L 466 56 L 485 68 H 690 L 718 45 L 748 89 L 780 35 L 817 68 H 1172" stroke="#ceff79" fill="none" stroke-width="2" stroke-dasharray="50 350" class="signal"/>
<rect x=".5" y=".5" width="1199" height="111" rx="18" fill="none" stroke="#2c332f"/>
</svg>
